[bot]
# KafuBot 主循环：CQHTTP 事件先进入有界队列，再由统一社交运行时感知。
event_queue_size = 100
event_workers = 100
adapter = "cqhttp"
adapter_max_retries = 30

[bot.log]
level = "INFO"
verbose_exception = true

[adapter.cqhttp]
adapter_type = "reverse-ws"
host = "127.0.0.1"
port = 8888
url = "/cqhttp/ws"
api_timeout = 10

[agent]
# 群聊、私聊都经过同一个运行时；这里的 session 只是上下文分区。
environment_message_limit = 100
image_analyzer_workers = 10
clear_keywords = ["/clear", "/清除"]
ignore_user_ids = [2830758180]

# 这些会话即使没有直接 @ 也允许 Global Gate 判断是否介入。
proactive_sessions = [
]

talk_value = 0.18
reply_keywords = [
    ["可不", 0.7],
    ["星界", 0.6],
    ["花谱", 0.5],
    ["里命", 0.2],
    ["情绪", 0.1],
]
[agent.gate]
# Gate 只决定是否唤醒唯一主循环，不决定是否回复。
threshold = 0.75
debounce_seconds = 1.5
idle_wake_seconds = 30
novelty_per_message = 0.2
max_novelty = 0.8
residue_half_life_seconds = 180

[agent.attention]
directedness = 1.4
social_obligation = 0.8
relationship = 0.35
urgency = 0.45
continuity = 0.9
novelty = 0.55
fatigue = 0.55
interruption = 0.35
random_jitter = 0.03
residue_half_life_seconds = 180

[agent.executive]
# Internal timestamps remain UTC; this IANA timezone is only used in LLM context.
display_timezone = "Auto"
home_session_limit = 12
initial_chat_messages = 12
read_page_size = 20
focus_budget = 12
max_steps = 10
max_replies_per_round = 3
context_message_limit = 36
recent_action_limit = 30
state_file = ".database/agent_loop_state.json"

[agent.plugins.environment]
enabled = true

[agent.plugins.self_state]
enabled = true

[agent.plugins.model]
enabled = true

[agent.plugins.ingress]
enabled = true

[agent.plugins.attention]
enabled = true

[agent.plugins.world_model]
enabled = true

[agent.plugins.replyer]
enabled = true

[agent.plugins.interaction]
enabled = true

[agent.plugins.social_signals]
enabled = true

[agent.plugins.conversation]
enabled = true

[agent.plugins.reply_effects]
enabled = true

[agent.plugins.limiter]
enabled = true

[agent.plugins.meme]
enabled = true

[agent.plugins.jargon]
enabled = true

[agent.plugins.memory]
enabled = true

[agent.plugins.summarization]
enabled = true

[agent.plugins.behavior]
enabled = true

[agent.plugins.expression]
enabled = true

[agent.plugins.prompt]
enabled = true

[agent.plugins.clock]
enabled = true

[agent.plugins.search_song]
enabled = true

[agent.plugins.view_message]
enabled = true
